<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!-- PRIVACY LOCK: the browser itself blocks every network request from this page (connect-src 'none').
     Only the app's own files (same origin) may load. No fonts, scripts or images from anywhere else. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; font-src 'none'; frame-src 'none'; object-src 'none'; media-src 'none'; form-action 'none'; base-uri 'none'; manifest-src 'self'; worker-src 'self'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hub">
<meta name="theme-color" content="#f5f4f9" id="theme-color">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="styles.css">
<title>Hub</title>
</head>
<body>

<!-- ======================= HUB HOME ======================= -->
<div class="app on" id="app-hub">
<main class="hub-main">
  <div class="hub-top">
    <div><div class="hub-date" id="hub-date"></div><h1 class="hub-title"><span id="hub-hello">Hello</span> 👋</h1></div>
    <button class="round-btn" data-hact="settings" aria-label="Hub settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12H5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg></button>
  </div>
  <div id="hub-banner"></div>
  <div class="app-grid" id="hub-apps"></div>
  <div id="hub-today"></div>
  <div class="hub-foot">🔒 Private · offline · only on this iPhone</div>
</main>
</div>

<!-- ======================= FINANCE ======================= -->
<div class="app" id="app-finance">
<main id="f-main">


  <!-- ================= ADD ================= -->
  <section class="screen on" id="s-add">
    <div class="add-top">
      <div class="date-ctl">
        <button class="icon-btn" id="d-prev" aria-label="Previous day">‹</button>
        <label class="date-chip" id="date-chip"><span>📅</span><span id="add-date-label">Today</span><input type="date" id="add-date" aria-label="Date"></label>
        <button class="icon-btn" id="d-next" aria-label="Next day">›</button>
      </div>
      <div class="seg method" id="add-method">
        <button data-m="cash">💵 Cash</button>
        <button data-m="online">💳 Online</button>
      </div>
    </div>
    <div class="amount-card" id="amount-card">
      <div class="amt-row"><div class="amt zero" id="add-amt">0</div><div class="amt-cur" id="add-cur">IQD</div></div>
      <div class="amt-cat" id="add-cat-label"></div>
    </div>
    <div class="cat-grid" id="add-cats"></div>
    <div class="chips" id="add-subs"></div>
    <input id="add-note" class="field" placeholder="📝  Note (optional)" maxlength="80" enterkeyhint="done" list="note-list" autocomplete="off">
    <datalist id="note-list"></datalist>
    <div class="keypad" id="keypad"></div>
  </section>

  <!-- ================= DASHBOARD ================= -->
  <section class="screen" id="s-dash">
    <h1>Dashboard</h1>
    <div id="dash-banner"></div>
    <div class="period-bar">
      <div class="seg full" id="dash-period">
        <button data-p="week">Week</button><button data-p="month">Month</button><button data-p="year">Year</button><button data-p="custom">Custom</button>
      </div>
      <div class="period-nav" id="dash-nav">
        <button class="icon-btn" id="p-prev" aria-label="Previous">‹</button>
        <div class="label" id="p-label"></div>
        <button class="icon-btn" id="p-next" aria-label="Next">›</button>
      </div>
      <div class="custom-range" id="dash-custom" hidden>
        <input type="date" class="field" id="c-from" aria-label="From"><input type="date" class="field" id="c-to" aria-label="To">
      </div>
    </div>
    <div id="dash-body"></div>
  </section>

  <!-- ================= HISTORY ================= -->
  <section class="screen" id="s-hist">
    <h1>History</h1>
    <div class="search-row">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="field" id="h-q" placeholder="Search" type="search" autocomplete="off">
      </div>
      <button class="filter-btn" id="h-filter-btn" aria-label="Filters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span class="fcount" id="h-fcount" hidden></span></button>
    </div>
    <div class="chips" id="h-active" hidden></div>
    <div class="seg full" id="h-status" style="margin-bottom:12px">
      <button data-st="">All</button><button data-st="active">Active</button><button data-st="refunded">↩ Refunded</button>
    </div>
    <div id="hist-body"></div>
  </section>

  <!-- ================= SETTINGS ================= -->
  <section class="screen" id="s-set">
    <h1>Settings</h1>
    <div id="set-body"></div>
  </section>

</main>


<nav class="tabs five" id="f-tabs">
  <button data-tab="hub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>Hub</button>
  <button data-tab="add" class="on"><svg viewBox="0 0 24 24"><circle class="plus" cx="12" cy="12" r="10" fill="currentColor"/><path d="M12 7.5v9M7.5 12h9" stroke="var(--card)" stroke-width="2.2" stroke-linecap="round"/></svg>Add</button>
  <button data-tab="dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9h-9z" fill="currentColor" fill-opacity=".2"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Dashboard</button>
  <button data-tab="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3.5" width="16" height="17" rx="3"/><path d="M8 8.5h8M8 12h8M8 15.5h5"/></svg>History</button>
  <button data-tab="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</nav>
</div>

<!-- ======================= NOTES ======================= -->
<div class="app" id="app-notes">
<main id="n-main">
  <section class="screen on" id="ns-todo">
    <div class="n-head">
      <div><div class="hub-date" id="n-date"></div><h1>Notes</h1></div>
      <button class="round-btn" data-nact="tags" aria-label="Manage tags">🏷️</button>
    </div>
    <div class="nstats" id="n-stats"></div>
    <div class="composer" id="n-composer">
      <div class="comp-top">
        <textarea id="n-text" rows="1" placeholder="What do you need to do?" maxlength="500" enterkeyhint="enter"></textarea>
        <button class="add-btn" id="n-add" aria-label="Add note" disabled><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <div class="comp-label">⏰ Deadline</div>
      <div class="daystrip" id="n-days"></div>
      <div class="chips tagrow" id="n-tags"></div>
    </div>
    <div class="chips" id="n-filter" hidden></div>
    <div id="n-list"></div>
  </section>
  <section class="screen" id="ns-done">
    <h1>Done</h1>
    <div id="nd-sum"></div>
    <div id="nd-list"></div>
  </section>
</main>
<nav class="tabs three" id="n-tabs">
  <button data-tab="hub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>Hub</button>
  <button data-tab="todo" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3.5" width="16" height="17" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Notes</button>
  <button data-tab="done"><span class="tab-badge" id="n-done-badge" hidden></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/></svg>Done</button>
</nav>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="restore-file" accept=".json,application/json" hidden>
<script src="core.js"></script>
<script src="finance.js"></script>
<script src="notes.js"></script>
<script src="hub.js"></script>
</body>
</html>
