<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!-- PRIVACY LOCK: the browser itself blocks every network request from this page (connect-src 'none').
     Only the app's own files (same origin) may load. No fonts, scripts or images from anywhere else. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; font-src 'none'; frame-src 'none'; object-src 'none'; media-src 'none'; form-action 'none'; base-uri 'none'; manifest-src 'self'; worker-src 'self'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Expenses">
<meta name="theme-color" content="#f5f4f9" id="theme-color">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Expenses</title>
<style>
:root{
  color-scheme:light;
  --bg:#f5f4f9; --card:#ffffff; --card2:#f0eff6; --text:#14131a; --text2:#55535f; --muted:#8c8a98; --line:#e7e5ef;
  --accent:#5b4be0; --accent-2:#2a78d6; --on-accent:#ffffff;
  --hero:linear-gradient(135deg,#6a4cf0 0%,#4f63e6 45%,#2a78d6 100%);
  --cash:#1baf7a; --online:#2a78d6;
  --good:#0f8a3c; --warn:#d48a00; --bad:#e34948;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948; --gray:#8c8a98;
  --shadow:0 1px 2px rgba(20,19,26,.05),0 6px 20px rgba(20,19,26,.06);
  --r:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e0e12; --card:#1a1a21; --card2:#24242d; --text:#f2f1f6; --text2:#c3c2cc; --muted:#8a8996; --line:#2b2b35;
    --accent:#8b7ff0; --accent-2:#3987e5;
    --hero:linear-gradient(135deg,#5a3fe0 0%,#4453d0 45%,#2367c2 100%);
    --cash:#199e70; --online:#3987e5;
    --good:#2fae5c; --warn:#e0a020; --bad:#e66767;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767; --gray:#7d7c88;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e0e12; --card:#1a1a21; --card2:#24242d; --text:#f2f1f6; --text2:#c3c2cc; --muted:#8a8996; --line:#2b2b35;
  --accent:#8b7ff0; --accent-2:#3987e5;
  --hero:linear-gradient(135deg,#5a3fe0 0%,#4453d0 45%,#2367c2 100%);
  --cash:#199e70; --online:#3987e5;
  --good:#2fae5c; --warn:#e0a020; --bad:#e66767;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767; --gray:#7d7c88;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg)}
body{color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:560px;margin:0 auto}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 10px) 16px 28px}
.screen{display:none}
.screen.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:30px;line-height:1.1;margin:6px 2px 14px;letter-spacing:-.02em}
h2{font-size:17px;margin:0;letter-spacing:-.01em}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.sub{color:var(--text2);font-size:13px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Tabs ---------- */
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--card) 86%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);border-radius:12px}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on .plus{fill:var(--accent)}

/* ---------- Segmented ---------- */
.seg{display:inline-flex;background:var(--card2);border-radius:14px;padding:3px;gap:2px}
.seg button{padding:7px 12px;border-radius:11px;font-size:14px;font-weight:600;color:var(--text2);white-space:nowrap;transition:background .15s,color .15s}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.full{display:flex}.seg.full button{flex:1}
.method button.on[data-m="cash"]{background:var(--cash);color:#fff}
.method button.on[data-m="online"]{background:var(--online);color:#fff}

/* ---------- Add ---------- */
.add-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.date-ctl{display:flex;align-items:center;gap:2px;background:var(--card);border-radius:14px;padding:3px;box-shadow:var(--shadow)}
.icon-btn{width:32px;height:34px;border-radius:11px;font-size:20px;color:var(--text2);display:grid;place-items:center}
.icon-btn:active{background:var(--card2)}
.date-chip{position:relative;display:flex;align-items:center;gap:6px;padding:6px 8px;font-weight:700;font-size:15px;white-space:nowrap}
.date-chip input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;-webkit-appearance:none;appearance:none}
.date-chip.past{color:var(--warn)}
.amount-card{--cat:var(--accent);position:relative;overflow:hidden;border-radius:24px;padding:16px 18px 14px;margin-bottom:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--cat) 26%,var(--card)) 0%,var(--card) 75%);box-shadow:var(--shadow);transition:background .25s}
.amount-card::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:color-mix(in srgb,var(--cat) 18%,transparent)}
.amt-row{display:flex;align-items:baseline;gap:8px;position:relative;z-index:1}
.amt{font-size:44px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.amt.zero{color:var(--muted)}
.amt-cur{font-size:16px;font-weight:700;color:var(--text2)}
.amt-cat{position:relative;z-index:1;margin-top:4px;font-size:14px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.cat-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:76px;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -16px 6px;padding-left:16px;padding-right:16px;scrollbar-width:none;scroll-snap-type:x proximity}
.cat-grid::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.cat-tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px 7px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);scroll-snap-align:start;transition:transform .1s,background .15s}
.cat-tile:active{transform:scale(.95)}
.cat-ico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--c) 18%,transparent)}
.cat-name{font-size:11.5px;font-weight:600;color:var(--text2);max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-tile.on{background:var(--c);box-shadow:0 6px 16px color-mix(in srgb,var(--c) 40%,transparent)}
.cat-tile.on .cat-name{color:#fff}
.cat-tile.on .cat-ico{background:rgba(255,255,255,.25)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 10px;padding:2px 16px;scrollbar-width:none;min-height:36px}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0 0 10px;padding:0}
.chip{flex:none;padding:7px 13px;border-radius:999px;font-size:13.5px;font-weight:600;background:var(--card);color:var(--text2);box-shadow:inset 0 0 0 1.5px var(--line);white-space:nowrap}
.chip.on{background:color-mix(in srgb,var(--c,var(--accent)) 16%,var(--card));color:var(--text);box-shadow:inset 0 0 0 1.5px var(--c,var(--accent))}
.field{width:100%;padding:12px 14px;border-radius:14px;border:0;background:var(--card);box-shadow:var(--shadow);outline:none;font-size:16px}
.field:focus{box-shadow:inset 0 0 0 2px var(--accent)}
select.field{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,52px);gap:8px;margin-top:10px}
.key{border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;transition:transform .08s,background .1s}
.key:active{transform:scale(.94);background:var(--card2)}
.key.fn{font-size:20px;color:var(--text2);background:var(--card2);box-shadow:none}
.key.save{grid-column:4;grid-row:2 / span 3;background:var(--hero);color:#fff;font-size:17px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 8px 20px rgba(91,75,224,.35)}
.key.save svg{width:30px;height:30px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-140%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14.5px;z-index:99;transition:transform .3s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translate(-50%,0)}

/* ---------- Dashboard ---------- */
.period-bar{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.period-nav{display:flex;align-items:center;justify-content:space-between}
.period-nav .label{font-weight:700;font-size:16px}
.custom-range{display:flex;gap:8px}
.custom-range input{flex:1;padding:9px 10px;font-size:15px}
.hero{background:var(--hero);color:#fff;border-radius:24px;padding:18px 18px 16px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 12px 30px rgba(79,99,230,.3)}
.hero::before{content:"";position:absolute;right:-50px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero::after{content:"";position:absolute;right:40px;bottom:-80px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero .lbl{font-size:13.5px;font-weight:600;opacity:.85;position:relative}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin:4px 0 2px;position:relative;font-variant-numeric:tabular-nums}
.hero .big small{font-size:16px;font-weight:700;opacity:.8;margin-left:4px}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;position:relative}
.hero-stat{background:rgba(255,255,255,.14);border-radius:14px;padding:8px 10px}
.hero-stat b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.hero-stat span{font-size:11.5px;opacity:.85}
.pill{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.18);font-size:13px;font-weight:600;position:relative}
.banner{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--warn) 14%,var(--card));border-radius:18px;padding:12px 14px;margin-bottom:14px;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--warn) 45%,transparent)}
.banner .ico{font-size:22px}
.btn{padding:10px 16px;border-radius:14px;font-weight:700;font-size:15px;background:var(--card2);color:var(--text)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.danger{background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--bad)}
.btn.small{padding:7px 12px;font-size:13.5px;border-radius:11px}
.btn.block{width:100%;display:block;text-align:center}
.btn:active{opacity:.75}
.donut-wrap{display:flex;justify-content:center;margin:2px 0 14px;position:relative}
.donut-wrap svg{width:200px;height:200px;overflow:visible}
.donut-seg{cursor:pointer;transition:stroke-width .15s}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.donut-center b{font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.donut-center span{font-size:12px;color:var(--text2)}
.legend{display:flex;flex-direction:column}
.leg-row{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.leg-row:first-child{border-top:0}
.leg-row .cat-ico{width:36px;height:36px;font-size:18px}
.leg-name{font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px}
.leg-bar{height:6px;border-radius:3px;background:var(--card2);margin-top:6px;overflow:hidden}
.leg-bar i{display:block;height:100%;border-radius:3px;background:var(--c)}
.leg-amt{text-align:right;font-variant-numeric:tabular-nums}
.leg-amt b{display:block;font-size:15px}
.leg-amt span{font-size:12px;color:var(--text2)}
.chev{color:var(--muted);font-size:18px;margin-left:2px}
.split{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px;margin:6px 0 12px;background:var(--card)}
.split i{display:block;height:100%}
.split i:first-child{border-radius:8px 0 0 8px}.split i:last-child{border-radius:0 8px 8px 0}.split i:only-child{border-radius:8px}
.split-legend{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split-item{background:var(--card2);border-radius:14px;padding:10px 12px}
.split-item .t{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--text2)}
.split-item b{display:block;font-size:17px;margin-top:2px;font-variant-numeric:tabular-nums}
.split-item span{font-size:12px;color:var(--text2)}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--bg);padding:6px 10px;border-radius:10px;font-size:12.5px;font-weight:600;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .12s;z-index:5;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.tip.show{opacity:1}
.tip small{display:block;font-weight:500;opacity:.75;font-size:11px}
.budget-bar{position:relative;height:12px;border-radius:6px;background:var(--card2);overflow:visible;margin:10px 0 6px}
.budget-bar i{display:block;height:100%;border-radius:6px;background:var(--st);max-width:100%}
.budget-bar .pace{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);border-radius:1px;opacity:.55}
.status{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--st);background:color-mix(in srgb,var(--st) 14%,transparent);padding:4px 9px;border-radius:999px}
.mini-budget{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.mini-budget .row{font-size:14px}
.mini-budget .budget-bar{height:8px;margin:6px 0 10px}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty .e-ico{font-size:40px;margin-bottom:6px}
.back-btn{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:700;font-size:15px}

/* ---------- History ---------- */
.search{position:relative;margin-bottom:10px}
.search input{padding-left:40px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.filters .field{padding:10px 12px;font-size:15px}
.hist-sum{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 10px;font-size:13.5px;color:var(--text2)}
.hist-sum b{color:var(--text)}
.day{margin-bottom:14px}
.day-head{display:flex;justify-content:space-between;padding:0 6px 6px;font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.03em}
.day-list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.exp{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:11px 14px;width:100%;text-align:left;border-top:1px solid var(--line)}
.exp:first-child{border-top:0}
.exp:active{background:var(--card2)}
.exp .cat-ico{width:40px;height:40px}
.exp-t{font-weight:600;font-size:15px}
.exp-n{font-size:13px;color:var(--text2)}
.exp-a{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;margin-top:3px}
.badge.cash{background:color-mix(in srgb,var(--cash) 16%,transparent);color:var(--cash)}
.badge.online{background:color-mix(in srgb,var(--online) 16%,transparent);color:var(--online)}

/* ---------- Settings ---------- */
.group-title{font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin:18px 6px 8px}
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:52px;width:100%;text-align:left}
.item:first-child{border-top:0}
.item .lbl{flex:1;font-weight:500}
.item .val{color:var(--text2);font-size:15px}
.item select{border:0;background:none;color:var(--text2);text-align:right;font-size:15px;-webkit-appearance:none;appearance:none;outline:none}
.item input.inline{border:0;background:none;text-align:right;width:140px;outline:none;color:var(--text2)}
.item .cat-ico{width:34px;height:34px;font-size:17px}
.ord{display:flex;gap:2px}
.ord button{width:30px;height:30px;border-radius:9px;background:var(--card2);color:var(--text2);font-size:14px}
.ord button:disabled{opacity:.3}
.note{font-size:12.5px;color:var(--muted);margin:8px 8px 0;line-height:1.45}
.lock{display:flex;gap:12px;align-items:flex-start;background:color-mix(in srgb,var(--good) 10%,var(--card));border-radius:18px;padding:14px;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--good) 35%,transparent);font-size:14px}
.lock .ico{font-size:24px}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--card2);color:var(--muted)}

/* ---------- Sheet ---------- */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;opacity:0;transition:opacity .2s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--bg);border-radius:26px 26px 0 0;z-index:51;max-height:92vh;overflow-y:auto;padding:8px 16px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.9,.3,1)}
.sheet.show{transform:none}
.sheet-x{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:50%;background:var(--card2);color:var(--text2);font-size:14px;font-weight:700}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h3{font-size:20px;margin:0 0 14px;letter-spacing:-.01em}
.form-l{font-size:13px;font-weight:700;color:var(--text2);margin:14px 4px 6px;display:block}
.sheet-actions{display:flex;gap:10px;margin-top:18px}
.sheet-actions .btn{flex:1;padding:14px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:36px;height:36px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--bg)}
.sw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4.5px var(--c)}
.sub-edit{display:flex;gap:8px;margin-bottom:8px}
.sub-edit .field{padding:10px 12px}
.toggle{position:relative;width:50px;height:30px;flex:none}
.toggle input{opacity:0;width:0;height:0}
.toggle span{position:absolute;inset:0;background:var(--line);border-radius:15px;transition:background .2s}
.toggle span::after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;top:2px;left:2px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle input:checked+span{background:var(--good)}
.toggle input:checked+span::after{transform:translateX(20px)}
</style>
</head>
<body>
<div id="app">
<main id="main">

  <!-- ================= ADD ================= -->
  <section class="screen on" id="s-add">
    <div class="add-top">
      <div class="date-ctl">
        <button class="icon-btn" id="d-prev" aria-label="Previous day">‹</button>
        <label class="date-chip" id="date-chip"><span>📅</span><span id="add-date-label">Today</span><input type="date" id="add-date" aria-label="Date"></label>
        <button class="icon-btn" id="d-next" aria-label="Next day">›</button>

        <button data-m="cash">💵 Cash</button>

    <div class="amount-card" id="amount-card">
      <div class="amt-row"><div class="amt zero" id="add-amt">0</div><div class="amt-cur" id="add-cur">IQD</div></div>
      <div class="amt-cat" id="add-cat-label"></div>
    </div>
    <div class="cat-grid" id="add-cats"></div>
    <div class="chips" id="add-subs"></div>
    <input id="add-note" class="field" placeholder="📝  Note (optional)" maxlength="80" enterkeyhint="done" list="note-list" autocomplete="off">
    <datalist id="note-list"></datalist>
    <div class="keypad" id="keypad"></div>
  </section>

  <!-- ================= DASHBOARD ================= -->
  <section class="screen" id="s-dash">
    <h1>Dashboard</h1>
    <div id="dash-banner"></div>
    <div class="period-bar">
      <div class="seg full" id="dash-period">
        <button data-p="week">Week</button><button data-p="month">Month</button><button data-p="year">Year</button><button data-p="custom">Custom</button>
      </div>
      <div class="period-nav" id="dash-nav">
        <button class="icon-btn" id="p-prev" aria-label="Previous">‹</button>

    <div id="dash-body"></div>

  <!-- ================= HISTORY ================= -->
  <section class="screen" id="s-hist">
    <h1>History</h1>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input class="field" id="h-q" placeholder="Search notes" type="search" autocomplete="off">
    </div>
    <div class="filters">
      <select class="field" id="h-cat"></select>
      <select class="field" id="h-range">
        <option value="all">All time</option><option value="week">This week</option><option value="month">This month</option><option value="lastmonth">Last month</option><option value="year">This year</option>
      </select>
    </div>
    <div class="seg full method" id="h-method" style="margin-bottom:12px">
      <button data-m="">All</button><button data-m="cash">💵 Cash</button><button data-m="online">💳 Online</button>
    </div>
    <div id="hist-body"></div>

  <!-- ================= SETTINGS ================= -->
  <section class="screen" id="s-set">
    <h1>Settings</h1>
    <div id="set-body"></div>

</main>

<nav class="tabs" id="tabs">
  <button data-tab="add" class="on"><svg viewBox="0 0 24 24"><circle class="plus" cx="12" cy="12" r="10" fill="currentColor"/><path d="M12 7.5v9M7.5 12h9" stroke="var(--card)" stroke-width="2.2" stroke-linecap="round"/></svg>Add</button>
  <button data-tab="dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9h-9z" fill="currentColor" fill-opacity=".2"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Dashboard</button>
  <button data-tab="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3.5" width="16" height="17" rx="3"/><path d="M8 8.5h8M8 12h8M8 15.5h5"/></svg>History</button>
  <button data-tab="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</nav>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="restore-file" accept=".json,application/json" hidden>

<script>
'use strict';
/* =====================================================================
   Personal Expense Tracker — everything lives on this device (IndexedDB).
   This file contains NO fetch / XMLHttpRequest / WebSocket / analytics,
   and the Content-Security-Policy above blocks them anyway.
   ===================================================================== */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ---------------- Dates (local, YYYY-MM-DD) ---------------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTHS_L = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
function niceDate(s, withYear) {
  const t = today();
  if (s === t) return 'Today';
  if (s === addDays(t, -1)) return 'Yesterday';
  if (s === addDays(t, 1)) return 'Tomorrow';
  const d = parse(s);
  const y = withYear || d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '';
  return `${WD[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}${y}`;
}
const shortDate = s => { const d = parse(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };

/* ---------------- Defaults ---------------- */
const COLORS = ['c1', 'c2', 'c3', 'c4', 'c5', 'c6', 'c7', 'c8', 'gray'];
const DEFAULT_CATS = [
  ['Food', '🍽️', 'c2', ['Groceries', 'Restaurants', 'Coffee & snacks', 'Delivery']],
  ['Transport', '🚗', 'c1', ['Fuel', 'Taxi', 'Car maintenance']],
  ['Bills', '🧾', 'c4', ['Electricity', 'Generator', 'Internet', 'Phone', 'Water']],
  ['Home', '🏠', 'c3', ['Rent', 'Household items', 'Repairs']],
  ['Shopping', '🛍️', 'c5', ['Clothes', 'Electronics', 'Other']],
  ['Health', '💊', 'c6', ['Pharmacy', 'Doctor']],
  ['Entertainment', '🎮', 'c7', ['Outings', 'Subscriptions', 'Games']],
  ['Family & gifts', '🎁', 'c8', ['Gifts', 'Family support']],
  ['Other', '📦', 'gray', []],
];
const makeDefaultCats = () => DEFAULT_CATS.map(([name, icon, color, subs], i) => ({
  id: 'cat_' + name.toLowerCase().replace(/[^a-z]+/g, '_'), name, icon, color, order: i, hidden: false, budget: 0,
  subs: subs.map(s => ({ id: 'sub_' + uid(), name: s, hidden: false })),
}));
const DEFAULT_SETTINGS = { currency: 'IQD', sep: ',', weekStart: 6, defaultMethod: 'last', theme: 'system', budget: 0 };
const CUR = { IQD: { dec: 0, sym: 'IQD', pre: false }, USD: { dec: 2, sym: '$', pre: true } };

/* ---------------- State ---------------- */
const S = {
  expenses: [], cats: [], settings: { ...DEFAULT_SETTINGS }, meta: {},
  add: { amount: '', catId: null, subId: null, method: 'cash', date: today() },
  dash: { period: 'month', anchor: today(), from: addDays(today(), -29), to: today(), drill: null },
  hist: { q: '', cat: '', method: '', range: 'all', limit: 150 },
  tab: 'add',
};

/* ---------------- IndexedDB ---------------- */
let db;
const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const doneP = t => new Promise((res, rej) => { t.oncomplete = () => res(); t.onerror = t.onabort = () => rej(t.error); });
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('expenses-db', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('expenses')) d.createObjectStore('expenses', { keyPath: 'id' }).createIndex('date', 'date');
      if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
    };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
const dbAll = () => reqP(db.transaction('expenses').objectStore('expenses').getAll());
const kvGet = k => reqP(db.transaction('kv').objectStore('kv').get(k));
async function kvSet(k, v) { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); return doneP(t); }
async function putExpenses(list) { const t = db.transaction('expenses', 'readwrite'); const s = t.objectStore('expenses'); list.forEach(e => s.put(e)); return doneP(t); }
async function delExpense(id) { const t = db.transaction('expenses', 'readwrite'); t.objectStore('expenses').delete(id); return doneP(t); }
async function clearExpenses() { const t = db.transaction('expenses', 'readwrite'); t.objectStore('expenses').clear(); return doneP(t); }
const saveCats = () => kvSet('categories', S.cats);
const saveSettings = () => kvSet('settings', S.settings);
const saveMeta = () => kvSet('meta', S.meta);

/* ---------------- Money ---------------- */
const cur = () => CUR[S.settings.currency] || CUR.IQD;
function groupInt(i) { const sep = S.settings.sep === ' ' ? ' ' : S.settings.sep; return i.replace(/\B(?=(\d{3})+(?!\d))/g, sep); }
function fmtNum(minor) {
  const c = cur(); const neg = minor < 0; const v = Math.abs(minor) / 10 ** c.dec;
  let [i, f] = v.toFixed(c.dec).split('.');
  const s = groupInt(i) + (f ? (S.settings.sep === '.' ? ',' : '.') + f : '');
  return (neg ? '−' : '') + s;
}
function fmt(minor) { const c = cur(); return c.pre ? c.sym + fmtNum(minor) : fmtNum(minor) + ' ' + c.sym; }
function compact(minor) {
  const x = Math.abs(minor) / 10 ** cur().dec; let s;
  if (x >= 1e6) s = +(x / 1e6).toFixed(x >= 1e7 ? 0 : 1) + 'M';
  else if (x >= 1e3) s = +(x / 1e3).toFixed(x >= 1e4 ? 0 : 1) + 'K';
  else s = String(Math.round(x));
  return (cur().pre ? cur().sym : '') + s;
}
const toMinor = str => { const c = cur(); const n = parseFloat(String(str).replace(/[^\d.]/g, '')); return isFinite(n) ? Math.round(n * 10 ** c.dec) : 0; };
const fromMinor = m => { const c = cur(); return c.dec ? (m / 10 ** c.dec).toFixed(c.dec) : String(m); };

/* ---------------- Categories ---------------- */
const catById = id => S.cats.find(c => c.id === id);
const subById = (cat, id) => cat?.subs.find(s => s.id === id);
const sortedCats = (incHidden) => S.cats.filter(c => incHidden || !c.hidden).sort((a, b) => a.order - b.order);
const col = c => `var(--${c?.color || 'gray'})`;
const catName = id => catById(id)?.name || 'Unknown';
const catIcon = id => catById(id)?.icon || '❔';

/* ---------------- UI helpers ---------------- */
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2000); }
function shake(el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

function openSheet(html, onMount) {
  const bd = document.createElement('div'); bd.className = 'backdrop';
  const sh = document.createElement('div'); sh.className = 'sheet'; sh.innerHTML = '<div class="grab"></div><button class="sheet-x" aria-label="Close">✕</button>' + html;
  document.body.append(bd, sh);
  requestAnimationFrame(() => { bd.classList.add('show'); sh.classList.add('show'); });
  const close = () => { bd.classList.remove('show'); sh.classList.remove('show'); setTimeout(() => { bd.remove(); sh.remove(); }, 280); };
  bd.onclick = close; $('.sheet-x', sh).onclick = close;
  onMount && onMount(sh, close);
  return close;
}
function ask(title, msg, buttons) {
  // buttons: [{label, value, cls}]
  return new Promise(res => {
    let val = null;
    openSheet(`<h3>${esc(title)}</h3><div class="sub" style="font-size:15px">${msg}</div>
      <div class="sheet-actions" style="flex-direction:column">${buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}">${esc(b.label)}</button>`).join('')}
      <button class="btn" data-i="-1">Cancel</button></div>`, (sh, close) => {
      $$('[data-i]', sh).forEach(b => b.onclick = () => { const i = +b.dataset.i; val = i < 0 ? null : buttons[i].value; close(); });
      const obs = new MutationObserver(() => { if (!sh.isConnected) { obs.disconnect(); res(val); } });
      obs.observe(document.body, { childList: true });
    });
  });
}

/* =====================================================================
   ADD SCREEN
   ===================================================================== */
function renderKeypad() {
  const dot = cur().dec ? '.' : '000';   // IQD gets a "000" key, USD gets a decimal point
  $('#keypad').innerHTML = `
    <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
    <button class="key fn" data-k="del" aria-label="Delete">⌫</button>
    <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
    <button class="key save" data-k="save"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>Save</button>
    <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
    <button class="key fn" data-k="${dot}" style="font-size:${dot === '000' ? 19 : 26}px">${dot}</button><button class="key" data-k="0">0</button><button class="key fn" data-k="clear" style="font-size:15px">C</button>`;
}
function keyPress(k) {
  let a = S.add.amount;
  if (k === 'save') return saveAdd();
  if (k === 'del') a = a.slice(0, -1);
  else if (k === 'clear') a = '';
  else if (k === '.') { if (!a.includes('.')) a = (a || '0') + '.'; }
  else {
    if (a.includes('.') && a.split('.')[1].length >= cur().dec) return;
    if (a.replace('.', '').length >= 12) return;
    if ((a === '' || a === '0') && (k === '0' || k === '000')) { a = ''; }
    else a = (a === '0' ? '' : a) + k;
  }
  S.add.amount = a; renderAmount();
}
function renderAmount() {
  const a = S.add.amount; const el = $('#add-amt');
  let txt = '0';
  if (a) { const [i, f] = a.split('.'); txt = groupInt(i || '0') + (a.includes('.') ? (S.settings.sep === '.' ? ',' : '.') + (f || '') : ''); }
  el.textContent = (cur().pre && a ? cur().sym : '') + txt;
  el.classList.toggle('zero', !a);
  el.style.fontSize = txt.length > 11 ? '34px' : txt.length > 8 ? '40px' : '';
  $('#add-cur').textContent = cur().pre ? '' : cur().sym;
}
function renderAddCats() {
  const cats = sortedCats();
  if (!catById(S.add.catId) || catById(S.add.catId).hidden) S.add.catId = cats[0]?.id || null;
  $('#add-cats').innerHTML = cats.map(c => `
    <button class="cat-tile ${c.id === S.add.catId ? 'on' : ''}" data-cat="${c.id}" style="--c:${col(c)}">
      <span class="cat-ico">${esc(c.icon)}</span><span class="cat-name">${esc(c.name)}</span></button>`).join('');
  renderAddSubs();
}
function renderAddSubs() {
  const c = catById(S.add.catId);
  const subs = (c?.subs || []).filter(s => !s.hidden);
  if (S.add.subId && !subs.find(s => s.id === S.add.subId)) S.add.subId = null;
  $('#add-subs').innerHTML = subs.length ? subs.map(s => `<button class="chip ${s.id === S.add.subId ? 'on' : ''}" data-sub="${s.id}" style="--c:${col(c)}">${esc(s.name)}</button>`).join('')
    : `<span class="sub" style="padding:8px 4px">No subcategories</span>`;
  const card = $('#amount-card'); card.style.setProperty('--cat', col(c));
  const sub = subById(c, S.add.subId);
  $('#add-cat-label').innerHTML = c ? `<span>${esc(c.icon)}</span>${esc(c.name)}${sub ? ' <span class="muted">›</span> ' + esc(sub.name) : ''}` : '';
  // note suggestions: recent notes in this category
  const notes = [...new Set(S.expenses.filter(e => e.catId === S.add.catId && e.note).sort((a, b) => b.createdAt.localeCompare(a.createdAt)).map(e => e.note))].slice(0, 8);
  $('#note-list').innerHTML = notes.map(n => `<option value="${esc(n)}">`).join('');
}
function renderAddDate() {
  const d = S.add.date;
  $('#add-date').value = d;
  $('#add-date-label').textContent = niceDate(d);
  $('#date-chip').classList.toggle('past', d !== today());
}
function renderAddMethod() { $$('#add-method button').forEach(b => b.classList.toggle('on', b.dataset.m === S.add.method)); }
function renderAdd() { renderKeypad(); renderAmount(); renderAddCats(); renderAddDate(); renderAddMethod(); }

async function saveAdd() {
  const amount = toMinor(S.add.amount);
  if (!amount) { shake($('#amount-card')); toast('Type an amount first'); return; }
  if (!S.add.catId) { shake($('#add-cats')); toast('Pick a category'); return; }
  const now = new Date();
  const e = {
    id: uid(), amount, method: S.add.method, catId: S.add.catId, subId: S.add.subId || null,
    note: $('#add-note').value.trim(), date: S.add.date || today(),
    createdAt: now.toISOString(), updatedAt: now.toISOString(),
  };
  await putExpenses([e]); S.expenses.push(e);
  S.meta.lastCat = e.catId; S.meta.lastMethod = e.method; saveMeta();
  requestPersist();
  toast(`✓ Saved ${fmt(amount)} · ${catName(e.catId)}${e.date !== today() ? ' · ' + niceDate(e.date) : ''}`);
  S.add.amount = ''; S.add.subId = null; S.add.date = today(); $('#add-note').value = '';
  renderAmount(); renderAddSubs(); renderAddDate();
}

/* =====================================================================
   DASHBOARD
   ===================================================================== */
function periodRange(p, anchor) {
  const d = parse(anchor);
  if (p === 'week') { const diff = (d.getDay() - S.settings.weekStart + 7) % 7; const from = addDays(anchor, -diff); return { from, to: addDays(from, 6) }; }
  if (p === 'month') return { from: ymd(new Date(d.getFullYear(), d.getMonth(), 1)), to: ymd(new Date(d.getFullYear(), d.getMonth() + 1, 0)) };
  if (p === 'year') return { from: `${d.getFullYear()}-01-01`, to: `${d.getFullYear()}-12-31` };
  let { from, to } = S.dash; if (from > to) [from, to] = [to, from]; return { from, to };
}
function shiftAnchor(p, anchor, dir) {
  const d = parse(anchor);
  if (p === 'week') return addDays(anchor, 7 * dir);
  if (p === 'month') return ymd(new Date(d.getFullYear(), d.getMonth() + dir, 1));
  if (p === 'year') return ymd(new Date(d.getFullYear() + dir, 0, 1));
  return anchor;
}
function prevRange(p, r) {
  if (p === 'custom') { const len = daysBetween(r.from, r.to) + 1; return { from: addDays(r.from, -len), to: addDays(r.from, -1) }; }
  return periodRange(p, shiftAnchor(p, r.from, -1));
}
function periodLabel(p, r) {
  const a = parse(r.from), b = parse(r.to);
  if (p === 'month') return `${MONTHS_L[a.getMonth()]} ${a.getFullYear()}`;
  if (p === 'year') return String(a.getFullYear());
  const sameY = a.getFullYear() === b.getFullYear();
  return `${a.getDate()} ${MONTHS[a.getMonth()]}${sameY ? '' : ' ' + a.getFullYear()} – ${b.getDate()} ${MONTHS[b.getMonth()]} ${b.getFullYear()}`;
}
const inRange = (e, r) => e.date >= r.from && e.date <= r.to;
const sum = list => list.reduce((s, e) => s + e.amount, 0);

function renderDash() {
  const p = S.dash.period;
  $$('#dash-period button').forEach(b => b.classList.toggle('on', b.dataset.p === p));
  $('#dash-custom').hidden = p !== 'custom';
  $('#dash-nav').style.display = p === 'custom' ? 'none' : '';
  if (p === 'custom') { $('#c-from').value = S.dash.from; $('#c-to').value = S.dash.to; }
  const r = periodRange(p, S.dash.anchor);
  $('#p-label').textContent = periodLabel(p, r);
  $('#p-next').style.visibility = r.to >= today() ? 'hidden' : '';

  // backup banner
  const n = S.expenses.length; const lb = S.meta.lastBackup;
  const ago = lb ? daysBetween(lb.slice(0, 10), today()) : null;
  $('#dash-banner').innerHTML = n && (ago === null || ago > 7) ? `
    <div class="banner"><span class="ico">⚠️</span><div class="grow"><b>${ago === null ? 'No backup yet' : `Last backup ${ago} days ago`}</b><div class="sub">Save a copy to On My iPhone</div></div>
    <button class="btn small primary" data-act="backup">Back up</button></div>` : '';

  const list = S.expenses.filter(e => inRange(e, r));
  const total = sum(list);
  const t = today();
  const elapsedTo = t < r.to ? t : r.to;
  const daysElapsed = t < r.from ? 0 : daysBetween(r.from, elapsedTo) + 1;
  const avg = daysElapsed ? Math.round(total / daysElapsed) : 0;

  // comparison: if the period is still running, compare to the same point of the previous period
  const pr = prevRange(p, r);
  let cmpHtml = '';
  const ongoing = t >= r.from && t < r.to;
  const prTo = ongoing ? (addDays(pr.from, daysElapsed - 1) < pr.to ? addDays(pr.from, daysElapsed - 1) : pr.to) : pr.to;
  const prevTotal = sum(S.expenses.filter(e => e.date >= pr.from && e.date <= prTo));
  const curCmp = ongoing ? sum(list.filter(e => e.date <= t)) : total;
  const word = { week: 'week', month: 'month', year: 'year', custom: 'period' }[p];
  const vs = ongoing ? `same point last ${word}` : `last ${word}`;
  if (prevTotal > 0) {
    const pct = Math.round((curCmp - prevTotal) / prevTotal * 100);
    cmpHtml = pct === 0 ? `<div class="pill">＝ Same as ${vs}</div>`
      : `<div class="pill">${pct > 0 ? '▲' : '▼'} ${Math.abs(pct)}% ${pct > 0 ? 'more' : 'less'} than ${vs}</div>`;
  } else if (curCmp > 0) cmpHtml = `<div class="pill">No spending in the previous ${word}</div>`;

  let html = `
  <div class="hero">
    <div class="lbl">Spent · ${esc(periodLabel(p, r))}</div>
    <div class="big">${cur().pre ? esc(cur().sym) + fmtNum(total) : fmtNum(total) + `<small>${esc(cur().sym)}</small>`}</div>
    ${cmpHtml}
    <div class="hero-stats">
      <div class="hero-stat"><b>${list.length}</b><span>expense${list.length !== 1 ? 's' : ''}</span></div>
      <div class="hero-stat"><b>${compact(avg)}</b><span>per day</span></div>
      <div class="hero-stat"><b>${list.length ? compact(Math.max(...list.map(e => e.amount))) : '–'}</b><span>biggest</span></div>
    </div>
  </div>`;

  html += budgetCard(p, r, list, daysElapsed);

  if (!list.length) {
    html += `<div class="card empty"><div class="e-ico">🧾</div><b>No expenses in this ${word}</b><div class="sub" style="margin-top:4px">Add one from the Add tab and it shows up here.</div></div>`;
    $('#dash-body').innerHTML = html; return;
  }

  html += S.dash.drill ? drillCard(list, r) : categoryCard(list, total);
  html += methodCard(list, total);
  html += trendCard(list, r, p);
  html += topCard(list);
  $('#dash-body').innerHTML = html;
  bindTrend();
}

function budgetCard(p, r, list, daysElapsed) {
  if (p !== 'month') return '';
  const catsWithBudget = sortedCats(true).filter(c => c.budget > 0);
  const B = S.settings.budget;
  if (!B && !catsWithBudget.length) return '';
  const totalDays = daysBetween(r.from, r.to) + 1;
  const pace = Math.min(1, daysElapsed / totalDays);
  const status = (spent, budget) => {
    const f = spent / budget;
    if (f >= 1) return { c: 'var(--bad)', t: '⛔ Over budget' };
    if (f > pace + 0.1 || f >= 0.9) return { c: 'var(--warn)', t: '⚠️ Ahead of pace' };
    return { c: 'var(--good)', t: '✓ On track' };
  };
  let h = `<div class="card"><div class="card-head"><h2>💰 Budget</h2>`;
  if (B) {
    const spent = sum(list); const st = status(spent, B);
    h += `<span class="status" style="--st:${st.c}">${st.t}</span></div>
      <div class="row" style="justify-content:space-between;align-items:baseline"><div><b style="font-size:20px" class="num">${fmtNum(spent)}</b> <span class="sub">of ${fmt(B)}</span></div>
      <div class="sub num">${spent <= B ? fmt(B - spent) + ' left' : fmt(spent - B) + ' over'}</div></div>
      <div class="budget-bar" style="--st:${st.c}"><i style="width:${Math.min(100, spent / B * 100)}%"></i>${pace < 1 && pace > 0 ? `<span class="pace" style="left:${pace * 100}%" title="Today"></span>` : ''}</div>
      <div class="sub">${pace < 1 && pace > 0 ? `The line marks today · ${totalDays - daysElapsed} days left` : ''}</div>`;
  } else h += `</div>`;
  if (catsWithBudget.length) {
    h += `<div class="${B ? 'mini-budget' : ''}">` + catsWithBudget.map(c => {
      const spent = sum(list.filter(e => e.catId === c.id)); const st = status(spent, c.budget);
      return `<div class="row"><span>${esc(c.icon)}</span><span class="grow ellip"><b>${esc(c.name)}</b></span><span class="sub num">${compact(spent)} / ${compact(c.budget)}</span></div>
        <div class="budget-bar" style="--st:${st.c}"><i style="width:${Math.min(100, spent / c.budget * 100)}%"></i></div>`;
    }).join('') + `</div>`;
  }
  return h + `</div>`;
}

function donutSVG(items, total, center) {
  const R = 78, SW = 26, C = 2 * Math.PI * R; const gap = items.length > 1 ? 3 : 0;
  let off = 0;
  const segs = items.map(it => {
    const len = it.v / total * C; const dash = Math.max(0.6, len - gap);
    const s = `<circle class="donut-seg" data-drill="${it.id}" cx="100" cy="100" r="${R}" fill="none" stroke="${it.c}" stroke-width="${SW}"
      stroke-dasharray="${dash} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"><title>${esc(it.name)}: ${fmt(it.v)}</title></circle>`;
    off += len; return s;
  }).join('');
  return `<div class="donut-wrap"><svg viewBox="0 0 200 200" role="img" aria-label="Spending by category">
    <circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--card2)" stroke-width="${SW}"/>${segs}</svg>
    <div class="donut-center">${center}</div></div>`;
}

function categoryCard(list, total) {
  const by = {};
  list.forEach(e => by[e.catId] = (by[e.catId] || 0) + e.amount);
  const items = Object.entries(by).map(([id, v]) => { const c = catById(id); return { id, v, name: c?.name || 'Unknown', icon: c?.icon || '❔', c: col(c) }; }).sort((a, b) => b.v - a.v);
  const top = items[0];
  return `<div class="card"><div class="card-head"><h2>📊 By category</h2><span class="sub">Tap for details</span></div>
    ${donutSVG(items, total, `<span>Top: ${esc(top.icon)} ${esc(top.name)}</span><b>${Math.round(top.v / total * 100)}%</b><span>${items.length} categor${items.length > 1 ? 'ies' : 'y'}</span>`)}
    <div class="legend">${items.map(it => {
      const pct = it.v / total * 100;
      return `<button class="leg-row" data-drill="${it.id}" style="--c:${it.c}">
        <span class="cat-ico">${esc(it.icon)}</span>
        <span><span class="leg-name"><span class="dot"></span>${esc(it.name)}</span><span class="leg-bar" style="display:block"><i style="width:${Math.max(2, pct)}%"></i></span></span>
        <span class="leg-amt"><b>${fmtNum(it.v)}</b><span>${pct < 1 ? '<1' : Math.round(pct)}% <span class="chev">›</span></span></span></button>`;

}

function drillCard(list, r) {
  const c = catById(S.dash.drill);
  const L = list.filter(e => e.catId === S.dash.drill);
  const total = sum(L); const all = sum(list);

        <div class="leg-bar" style="height:10px;border-radius:5px"><i style="width:${Math.max(2, it.v / max * 100)}%;border-radius:5px;opacity:${it.id === '_none' ? .45 : 1}"></i></div></div>`).join('')
      : `<div class="empty">Nothing in ${esc(c?.name)} this period</div>`}

    <button class="btn block" style="margin-top:12px" data-act="hist-cat" data-cat="${c?.id}">See all in History</button>

function methodCard(list, total) {
  const cash = sum(list.filter(e => e.method === 'cash')); const online = total - cash;
  const nc = list.filter(e => e.method === 'cash').length, no = list.length - nc;

  return `<div class="card"><div class="card-head"><h2>💳 Cash vs Online</h2></div>
    <div class="split">${cash ? `<i style="width:${cash / total * 100}%;background:var(--cash)"></i>` : ''}${online ? `<i style="width:${online / total * 100}%;background:var(--online)"></i>` : ''}</div>
    <div class="split-legend">
      <div class="split-item"><div class="t"><span class="dot" style="--c:var(--cash)"></span>💵 Cash</div><b>${fmtNum(cash)}</b><span>${pc}% · ${nc} expense${nc !== 1 ? 's' : ''}</span></div>
      <div class="split-item"><div class="t"><span class="dot" style="--c:var(--online)"></span>💳 Online</div><b>${fmtNum(online)}</b><span>${total ? 100 - pc : 0}% · ${no} expense${no !== 1 ? 's' : ''}</span></div>
    </div></div>`;
}

let trendData = null;
function trendCard(list, r, p) {
  const days = daysBetween(r.from, r.to) + 1; const monthly = days > 62;
  const buckets = [];
  if (!monthly) for (let i = 0; i < days; i++) { const d = addDays(r.from, i); buckets.push({ key: d, v: 0, d }); }
  else {
    let d = parse(r.from); d = new Date(d.getFullYear(), d.getMonth(), 1); const end = parse(r.to);
    while (d <= end) { buckets.push({ key: `${d.getFullYear()}-${pad(d.getMonth() + 1)}`, v: 0, m: new Date(d) }); d = new Date(d.getFullYear(), d.getMonth() + 1, 1); }
  }
  const idx = Object.fromEntries(buckets.map((b, i) => [b.key, i]));
  list.forEach(e => { const k = monthly ? e.date.slice(0, 7) : e.date; if (idx[k] !== undefined) buckets[idx[k]].v += e.amount; });
  const t = today();
  const W = 340, H = 170, pl = 36, pr = 4, pt = 12, pb = 22, iw = W - pl - pr, ih = H - pt - pb;
  const maxV = Math.max(1, ...buckets.map(b => b.v));
  const major = maxV / 10 ** cur().dec; const pw = 10 ** Math.floor(Math.log10(major || 1)); const n = major / pw;
  const top = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * pw * 10 ** cur().dec;
  const n_ = buckets.length; const bw = iw / n_; const barW = Math.max(2, Math.min(28, bw * (n_ > 20 ? 0.62 : 0.56)));
  const y = v => pt + ih - v / top * ih;
  const elapsed = buckets.filter(b => monthly ? b.key <= t.slice(0, 7) : b.key <= t).length || 1;
  const avg = sum(list) / elapsed;
  let grid = '';
  [0, 0.5, 1].forEach(f => { const yy = pt + ih - f * ih; grid += `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1" ${f ? 'stroke-dasharray="2 3"' : ''}/>
    <text x="${pl - 6}" y="${yy + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${f ? compact(top * f) : '0'}</text>`; });
  const bar = (x, yy, w, h) => { const rr = Math.min(4, w / 2, h); return h <= 0 ? '' : `M${x},${yy + h}V${yy + rr}Q${x},${yy} ${x + rr},${yy}H${x + w - rr}Q${x + w},${yy} ${x + w},${yy + rr}V${yy + h}Z`; };
  const bars = buckets.map((b, i) => { const x = pl + i * bw + (bw - barW) / 2; const h = b.v / top * ih; const isNow = monthly ? b.key === t.slice(0, 7) : b.key === t;
    return `<path class="tbar" data-i="${i}" d="${bar(x, y(b.v), barW, h)}" fill="${isNow ? 'var(--accent)' : 'var(--c1)'}"/>`; }).join('');
  const step = monthly ? 1 : n_ <= 7 ? 1 : n_ <= 16 ? 2 : n_ <= 31 ? 5 : 10;
  const labels = buckets.map((b, i) => {
    if (monthly) return `<text x="${pl + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--muted)">${n_ > 12 ? MONTHS[b.m.getMonth()][0] : MONTHS[b.m.getMonth()].slice(0, n_ > 6 ? 1 : 3)}</text>`;
    const d = parse(b.d);
    if (n_ <= 7) return `<text x="${pl + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--muted)">${WD[d.getDay()]}</text>`;
    const dn = d.getDate(); if (!(i === 0 || (dn % step === 0 && dn !== 30) )) return '';
    return `<text x="${pl + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--muted)">${i === 0 && dn !== 1 ? shortDate(b.d) : dn}</text>`;
  }).join('');
  const avgLine = avg > 0 ? `<line x1="${pl}" x2="${W - pr}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--c2)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="${W - pr}" y="${y(avg) - 4}" text-anchor="end" font-size="10" font-weight="700" fill="var(--text2)">avg ${compact(avg)}</text>` : '';
  trendData = { buckets, monthly, pl, bw, W, top, ih, pt, y };
  return `<div class="card"><div class="card-head"><h2>📈 ${monthly ? 'Monthly' : 'Daily'} spending</h2><span class="sub">Tap a bar</span></div>
    <div class="chart" id="trend"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Spending over time">${grid}${bars}${avgLine}${labels}
      <rect id="trend-hit" x="${pl}" y="0" width="${iw}" height="${H}" fill="transparent"/></svg><div class="tip" id="trend-tip"></div></div></div>`;
}
function bindTrend() {
  const wrap = $('#trend'); if (!wrap || !trendData) return;
  const svg = $('svg', wrap), tip = $('#trend-tip');
  const show = ev => {
    const rect = svg.getBoundingClientRect(); const sx = (ev.clientX - rect.left) / rect.width * trendData.W;
    const i = Math.floor((sx - trendData.pl) / trendData.bw); const b = trendData.buckets[i];
    if (!b) return hide();
    $$('.tbar', svg).forEach(p => p.style.opacity = +p.dataset.i === i ? 1 : .35);
    const label = trendData.monthly ? `${MONTHS_L[b.m.getMonth()]} ${b.m.getFullYear()}` : niceDate(b.d, false);
    tip.innerHTML = `${fmt(b.v)}<small>${label}</small>`;
    const cx = (trendData.pl + i * trendData.bw + trendData.bw / 2) / trendData.W * rect.width;
    tip.style.left = Math.max(50, Math.min(rect.width - 50, cx)) + 'px';
    tip.style.top = (trendData.y(b.v) / trendData.W * rect.width - 8) + 'px';
    tip.classList.add('show');
  };
  const hide = () => { tip.classList.remove('show'); $$('.tbar', svg).forEach(p => p.style.opacity = 1); };
  svg.addEventListener('pointerdown', show); svg.addEventListener('pointermove', show); svg.addEventListener('pointerleave', hide);
}

function topCard(list) {
  const top = [...list].sort((a, b) => b.amount - a.amount).slice(0, 5);
  return `<div class="card"><div class="card-head"><h2>🔥 Biggest expenses</h2></div>

      <span class="exp-a">${fmtNum(e.amount)}</span></button>`; }).join('')}</div>`;
}

function histRange() {
  const t = today(); const k = S.hist.range;
  if (k === 'week' || k === 'month' || k === 'year') return periodRange(k, t);
  if (k === 'lastmonth') return periodRange('month', shiftAnchor('month', t, -1));

}
function renderHist() {
  const q = S.hist.q.trim().toLowerCase(); const r = histRange();
  const list = S.expenses.filter(e =>
    (!S.hist.cat || e.catId === S.hist.cat) && (!S.hist.method || e.method === S.hist.method) && (!r || inRange(e, r)) &&
    (!q || (e.note || '').toLowerCase().includes(q) || catName(e.catId).toLowerCase().includes(q) || (subById(catById(e.catId), e.subId)?.name || '').toLowerCase().includes(q))

    (list.length > shown.length ? `<button class="btn block" data-act="more">Show more (${list.length - shown.length})</button>` : '');
}
function expRow(e) {

    <div class="seg full method" id="e-method"><button data-m="cash">💵 Cash</button><button data-m="online">💳 Online</button></div>
    <label class="form-l">Date</label>
    <input class="field" type="date" id="e-date" value="${e.date}">
    <label class="form-l">Category</label>
    <div class="chips wrap" id="e-cats"></div>
    <div class="chips wrap" id="e-subs"></div>
    <label class="form-l">Note</label>
    <input class="field" id="e-note" maxlength="80" value="${esc(e.note)}">
    <div class="sheet-actions"><button class="btn danger" id="e-del">Delete</button><button class="btn primary" id="e-save">Save changes</button></div>`;
  openSheet(html, (sh, close) => {
    const drawCats = () => {
      $('#e-cats', sh).innerHTML = sortedCats(true).filter(c => !c.hidden || c.id === st.catId).map(c => `<button class="chip ${c.id === st.catId ? 'on' : ''}" data-c="${c.id}" style="--c:${col(c)}">${esc(c.icon)} ${esc(c.name)}</button>`).join('');
      const c = catById(st.catId); const subs = (c?.subs || []).filter(s => !s.hidden || s.id === st.subId);
      $('#e-subs', sh).innerHTML = subs.map(s => `<button class="chip ${s.id === st.subId ? 'on' : ''}" data-s="${s.id}" style="--c:${col(c)}">${esc(s.name)}</button>`).join('');
      $$('#e-method button', sh).forEach(b => b.classList.toggle('on', b.dataset.m === st.method));
    };
    drawCats();
    sh.addEventListener('click', async ev => {
      const b = ev.target.closest('button'); if (!b) return;
      if (b.dataset.c) { if (st.catId !== b.dataset.c) st.subId = null; st.catId = b.dataset.c; drawCats(); }
      else if (b.dataset.s) { st.subId = st.subId === b.dataset.s ? null : b.dataset.s; drawCats(); }
      else if (b.dataset.m) { st.method = b.dataset.m; drawCats(); }
      else if (b.id === 'e-save') {
        const amount = toMinor($('#e-amt', sh).value); if (!amount) { shake($('#e-amt', sh)); return; }
        Object.assign(e, { amount, method: st.method, catId: st.catId, subId: st.subId, date: $('#e-date', sh).value || e.date, note: $('#e-note', sh).value.trim(), updatedAt: new Date().toISOString() });
        await putExpenses([e]); close(); toast('✓ Updated'); refresh();
      } else if (b.id === 'e-del') {
        close();
        const ok = await ask('Delete this expense?', `${esc(fmt(e.amount))} · ${esc(catName(e.catId))} · ${niceDate(e.date)}`, [{ label: 'Delete', value: true, cls: 'danger' }]);
        if (ok) { await delExpense(e.id); S.expenses = S.expenses.filter(x => x.id !== e.id); toast('Deleted'); refresh(); }
      }
    });
  });
}

      else if (b.id === 'k-addsub') { c.subs.push({ id: 'sub_' + uid(), name: '', hidden: false }); drawSubs(); $$('[data-si]', sh).pop().focus(); }
      else if (b.dataset.sx !== undefined) {

async function moveCat(id, dir) {
  const cats = sortedCats(true); const i = cats.findIndex(c => c.id === id); const j = i + dir;
  if (j < 0 || j >= cats.length) return;
  [cats[i], cats[j]] = [cats[j], cats[i]]; cats.forEach((c, k) => c.order = k);
  await saveCats(); renderSettings(); renderAddCats();
}

/* ---------------- Backup / restore / CSV ---------------- */
async function shareOrDownload(blob, name) {
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return true; }
    catch (err) { if (err.name === 'AbortError') return false; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  return true;
}
async function doBackup() {
  const data = { app: 'expenses', version: 1, exportedAt: new Date().toISOString(), settings: S.settings, categories: S.cats, expenses: S.expenses };
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const ok = await shareOrDownload(blob, `expenses-backup-${today()}.json`);
  if (ok) { S.meta.lastBackup = new Date().toISOString(); await saveMeta(); toast('✓ Backup created'); refresh(); }
}
async function doCSV() {
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const rows = [['Date', 'Amount', 'Currency', 'Payment', 'Category', 'Subcategory', 'Note', 'Created']];
  [...S.expenses].sort((a, b) => a.date.localeCompare(b.date)).forEach(e => { const c = catById(e.catId);
    rows.push([e.date, fromMinor(e.amount), S.settings.currency, e.method === 'cash' ? 'Cash' : 'Online', c?.name || '', subById(c, e.subId)?.name || '', e.note, e.createdAt]); });
  const blob = new Blob(['﻿' + rows.map(r => r.map(q).join(',')).join('\r\n')], { type: 'text/csv' });
  await shareOrDownload(blob, `expenses-${today()}.csv`);
}
async function doRestore(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { toast('That file is not a valid backup'); return; }
  if (!data || data.app !== 'expenses' || !Array.isArray(data.expenses)) { toast('That file is not an Expenses backup'); return; }
  const when = data.exportedAt ? niceDate(data.exportedAt.slice(0, 10), true) : 'unknown date';
  const mode = await ask('Restore backup', `Backup from <b>${esc(when)}</b> with <b>${data.expenses.length}</b> expenses.<br><br><b>Merge</b> adds them to what's here. <b>Replace</b> wipes current data first.`,
    [{ label: 'Merge', value: 'merge', cls: 'primary' }, { label: 'Replace everything', value: 'replace', cls: 'danger' }]);
  if (!mode) return;
  const clean = data.expenses.filter(e => e && e.id && Number.isFinite(e.amount) && /^\d{4}-\d{2}-\d{2}$/.test(e.date))
    .map(e => ({ method: 'cash', note: '', subId: null, createdAt: new Date().toISOString(), ...e }));
  if (mode === 'replace') {
    await clearExpenses(); S.expenses = [];
    if (Array.isArray(data.categories) && data.categories.length) S.cats = data.categories;
    if (data.settings) S.settings = { ...DEFAULT_SETTINGS, ...data.settings };
  } else if (Array.isArray(data.categories)) {
    data.categories.forEach(bc => { const ex = catById(bc.id); if (!ex) S.cats.push({ ...bc, order: S.cats.length });
      else bc.subs?.forEach(bs => { if (!ex.subs.find(s => s.id === bs.id)) ex.subs.push(bs); }); });
  }
  await putExpenses(clean);
  const map = new Map(S.expenses.map(e => [e.id, e])); clean.forEach(e => map.set(e.id, e)); S.expenses = [...map.values()];
  await saveCats(); await saveSettings(); applyTheme();
  toast(`✓ Restored ${clean.length} expenses`); refresh();
}
async function eraseAll() {
  const ok = await ask('Erase all expenses?', `This deletes all <b>${S.expenses.length}</b> expenses on this device. Categories and settings stay. Make a backup first if unsure.`,
    [{ label: 'Back up first', value: 'backup', cls: 'primary' }, { label: 'Erase everything', value: 'erase', cls: 'danger' }]);
  if (ok === 'backup') return doBackup();
  if (ok === 'erase') { await clearExpenses(); S.expenses = []; toast('All expenses erased'); refresh(); }
}
async function requestPersist() {
  if (S.meta.persisted || !navigator.storage?.persist) return;
  try { const p = await navigator.storage.persist(); if (p) { S.meta.persisted = true; saveMeta(); } } catch {}
}

/* ---------------- Theme ---------------- */
function applyTheme() {
  const t = S.settings.theme; const root = document.documentElement;
  if (t === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', t);
  requestAnimationFrame(() => { $('#theme-color').content = getComputedStyle(document.body).backgroundColor; });
}

/* =====================================================================
   NAV + EVENTS
   ===================================================================== */
function showTab(tab) {
  S.tab = tab;
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $$('.screen').forEach(s => s.classList.toggle('on', s.id === 's-' + tab));
  $('#main').scrollTop = 0;
  refresh();
}
function refresh() {
  if (S.tab === 'add') { renderAmount(); renderAddCats(); renderAddDate(); renderAddMethod(); }
  if (S.tab === 'dash') renderDash();
  if (S.tab === 'hist') { renderHistFilters(); renderHist(); }
  if (S.tab === 'set') renderSettings();
}

function bind() {
  $('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) showTab(b.dataset.tab); });

  // Add screen
  $('#keypad').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) keyPress(b.dataset.k); });
  let holdT; $('#keypad').addEventListener('pointerdown', e => { if (e.target.closest('[data-k="del"]')) holdT = setTimeout(() => { S.add.amount = ''; renderAmount(); }, 550); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => $('#keypad').addEventListener(ev, () => clearTimeout(holdT)));
  $('#add-cats').addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (!b) return; if (S.add.catId !== b.dataset.cat) S.add.subId = null; S.add.catId = b.dataset.cat; renderAddCats(); });
  $('#add-subs').addEventListener('click', e => { const b = e.target.closest('[data-sub]'); if (!b) return; S.add.subId = S.add.subId === b.dataset.sub ? null : b.dataset.sub; renderAddSubs(); });
  $('#add-method').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (b) { S.add.method = b.dataset.m; renderAddMethod(); } });
  $('#add-date').addEventListener('change', e => { if (e.target.value) { S.add.date = e.target.value; renderAddDate(); } });
  $('#d-prev').onclick = () => { S.add.date = addDays(S.add.date, -1); renderAddDate(); };
  $('#d-next').onclick = () => { S.add.date = addDays(S.add.date, 1); renderAddDate(); };
  $('#add-note').addEventListener('keydown', e => { if (e.key === 'Enter') { e.target.blur(); } });
  document.addEventListener('keydown', e => { // desktop typing support
    if (S.tab !== 'add' || e.target.matches('input,select,textarea') || $('.sheet')) return;
    if (/^[0-9]$/.test(e.key)) keyPress(e.key); else if (e.key === 'Backspace') keyPress('del'); else if (e.key === '.' && cur().dec) keyPress('.'); else if (e.key === 'Enter') saveAdd();
  });

  // Dashboard
  $('#dash-period').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (!b) return; S.dash.period = b.dataset.p; S.dash.anchor = today(); renderDash(); });
  $('#p-prev').onclick = () => { S.dash.anchor = shiftAnchor(S.dash.period, periodRange(S.dash.period, S.dash.anchor).from, -1); renderDash(); };
  $('#p-next').onclick = () => { S.dash.anchor = shiftAnchor(S.dash.period, periodRange(S.dash.period, S.dash.anchor).from, 1); renderDash(); };
  $('#c-from').onchange = e => { if (e.target.value) { S.dash.from = e.target.value; renderDash(); } };
  $('#c-to').onchange = e => { if (e.target.value) { S.dash.to = e.target.value; renderDash(); } };

  // History
  $('#h-q').addEventListener('input', e => { S.hist.q = e.target.value; S.hist.limit = 150; renderHist(); });
  $('#h-cat').onchange = e => { S.hist.cat = e.target.value; S.hist.limit = 150; renderHist(); };
  $('#h-range').onchange = e => { S.hist.range = e.target.value; S.hist.limit = 150; renderHist(); };
  $('#h-method').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (!b) return; S.hist.method = b.dataset.m; renderHistFilters(); renderHist(); });

  // Settings inputs
  $('#set-body').addEventListener('change', async e => {
    const id = e.target.id; const s = S.settings;
    if (id === 'set-theme') { s.theme = e.target.value; applyTheme(); }
    else if (id === 'set-cur') {
      if (S.expenses.length && e.target.value !== s.currency) {
        const ok = await ask('Change currency?', 'Existing amounts are <b>not converted</b>; only the label and decimals change. Best done before you start logging.', [{ label: 'Change anyway', value: true, cls: 'danger' }]);
        if (!ok) { e.target.value = s.currency; return; }
      }
      s.currency = e.target.value; renderKeypad();
    }
    else if (id === 'set-sep') s.sep = e.target.value;
    else if (id === 'set-week') s.weekStart = +e.target.value;
    else if (id === 'set-method') s.defaultMethod = e.target.value;
    else if (id === 'set-budget') s.budget = toMinor(e.target.value);
    else return;
    await saveSettings(); renderSettings(); toast('✓ Saved');
  });

  // Global delegated actions
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act],[data-drill],[data-edit],[data-editcat],[data-move]'); if (!b || b.closest('.sheet')) return;
    if (b.dataset.drill) { S.dash.drill = b.dataset.drill; renderDash(); $('#dash-body').scrollIntoView({ block: 'start', behavior: 'smooth' }); return; }
    if (b.dataset.edit) return openEdit(b.dataset.edit);
    if (b.dataset.editcat) return openCatEditor(b.dataset.editcat);
    if (b.dataset.move) return moveCat(b.dataset.move, +b.dataset.dir);
    const a = b.dataset.act;
    if (a === 'undrill') { S.dash.drill = null; renderDash(); }
    else if (a === 'backup') doBackup();
    else if (a === 'csv') doCSV();
    else if (a === 'restore') $('#restore-file').click();
    else if (a === 'erase') eraseAll();
    else if (a === 'more') { S.hist.limit += 150; renderHist(); }
    else if (a === 'hist-cat') { S.hist.cat = b.dataset.cat; S.hist.range = { week: 'week', month: 'month', year: 'year' }[S.dash.period] || 'all'; showTab('hist'); }
  });
  $('#restore-file').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) doRestore(f); });

  // When the app comes back to the foreground on a new day, reset the add-date to today
  let lastDay = today();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && today() !== lastDay) { lastDay = today(); S.add.date = today(); S.dash.anchor = today(); refresh(); } });
}

/* ---------------- Boot ---------------- */
async function boot() {
  try { db = await openDB(); }
  catch (err) { document.body.innerHTML = `<div style="padding:40px;font-family:system-ui">Storage is unavailable. Don't use Private Browsing.<br><small>${esc(err && err.message)}</small></div>`; return; }
  S.settings = { ...DEFAULT_SETTINGS, ...(await kvGet('settings') || {}) };
  S.meta = (await kvGet('meta')) || {};
  S.cats = (await kvGet('categories')) || null;
  if (!S.cats) { S.cats = makeDefaultCats(); await saveCats(); }
  S.expenses = await dbAll();
  S.add.catId = S.meta.lastCat || null;
  S.add.method = S.settings.defaultMethod === 'last' ? (S.meta.lastMethod || 'cash') : S.settings.defaultMethod;
  applyTheme(); bind(); renderAdd();
}
